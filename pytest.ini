# pytest 配置: 默认只跑"纯单元测试"。
# real-resource 测试(GUI 冒烟 MainWindow / 真实监控线程 / 真实 SSH/端口/进程)默认跳过,
# 由 `-m gui` 显式手动执行 —— 切勿在 dsh(端口 3080)正在运行时自动触发。
# 运行:
#   python -m pytest tests/            # 只跑纯单元测试(默认, 安全)
#   python -m pytest tests/ -m gui     # 手动执行 GUI/resource 冒烟(需人工把关)
[pytest]
addopts = -m "not gui"
testpaths = tests
markers =
    gui: 构造真实 MainWindow/触发真实监控线程与真实子进程的冒烟; 默认跳过, 仅 -m gui 手动执行
    real: 涉及真实 SSH/端口/进程资源的测试; 默认跳过, 交由人工执行
