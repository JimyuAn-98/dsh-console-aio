name: Release

# 触发: 推送 v* 标签时自动构建并发布 GitHub Release
# 用法: 打 tag (git tag v0.3.1 && git push origin v0.3.1) 即自动构建+发布
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build onefile exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name dsh-console-aio `
            --hidden-import core --hidden-import core.tunnel_mgr `
            --hidden-import ui.dialogs `
            --hidden-import ui.pages_sessions --hidden-import ui.pages_agents `
            --hidden-import ui.pages_profiles --hidden-import ui.pages_plugins `
            --hidden-import ui.pages_taskboard --hidden-import ui.pages_usage `
            --hidden-import ui.pages_llm --hidden-import ui.pages_ops `
            --hidden-import ui.pages_keys --hidden-import ui.pages_version `
            --hidden-import ui.pages_deployments --hidden-import ui.pages_logs `
            --hidden-import ui.pages_settings `
            --add-data "ui/theme.qss;ui" `
            --add-data "RELEASE_NOTES.md;." `
            dsh-console-aio.py

      - name: Place exe where installer.iss expects it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/dist | Out-Null
          Copy-Item dist/dsh-console-aio.exe installer/dist/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/installer.iss "/DMyAppVersion=$ver"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/dist/dsh-console-aio-setup-*.exe
          body_path: RELEASE_BODY.md
          generate_release_notes: false
