name: Release

# 触发: 推送 v* 标签时自动构建并发布 GitHub Release
# 用法: 打 tag (git tag v0.3.1 && git push origin v0.3.1) 即自动构建+发布
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build onefile exe
        shell: pwsh
        run: |
          # 用 collect-submodules 收全 core/app/ui: 三者都有函数内惰性 import 的子模块
          # (core.pkgmgr / core.nodeid / core.runtime / core.cache 等), 手写 hidden-import 列表
          # 容易漏; collect-submodules 由 PyInstaller 递归收集, 新增模块自动纳入。
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name dsh-console-aio `
            --icon logo.ico `
            --collect-submodules core `
            --collect-submodules app `
            --collect-submodules ui `
            --add-data "ui/theme.qss;ui" `
            --add-data "logo.png;." `
            --add-data "RELEASE_NOTES.md;." `
            dsh-console-aio.py

      - name: Place exe where installer.iss expects it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/dist | Out-Null
          Copy-Item dist/dsh-console-aio.exe installer/dist/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/installer.iss "/DMyAppVersion=$ver"

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem installer/dist/dsh-console-aio-setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii installer/dist/SHA256SUMS.txt
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/dist/dsh-console-aio-setup-*.exe
            installer/dist/SHA256SUMS.txt
          body_path: RELEASE_BODY.md
          generate_release_notes: false
